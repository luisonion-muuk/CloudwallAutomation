find_gather_response_sql: "SELECT gr.gather_response_source_id, gr.gather_response_type_id
                            FROM gather_response gr
                            JOIN gather g USING (gather_id)
                            WHERE g.order_id = %d
                            AND g.talent_person_id = %d
                            ORDER BY gr.create_date DESC
                            LIMIT 1"
