# yaml templates for create_new_order

#--------------------------------------
# minimum required data to create an order - all other required fields will be set with default values - see template below to override defaults
template_min_order_data:
  order_name:
  market_value: # see common_data.rb for markets
  client_name:

#---------------------------------------
# minimum required to create an order and quick fill after save
template_order_data_plus_fill:
  order_name:
  market_value: # see common_data.rb for markets
  client_name:
  quick_fill:
    talent_id: # value can be filled in the test or added here
    work_location_type: # report_to or talent_home

#---------------------------------------
# all required and optional fields available for creating an order
# copy what you need and pls remove from your yaml any fields whose vals don't matter for your test
template_max_order_data:
  # the minimum required to create an order using the new method
  order_name: Example Autotest Order Name +field_abbr +timestamp
  market_value: '11'  # new york (example - see common_data.rb for markets)
  client_name: Example Client Name
  # required order fields - add key/vals to your yaml only if your test needs a non-default value
  contact_id: # value can be added here or filled in the test, using get_contact_id()
  start_date: tdate+days -30
  end_date: tdate+days 30
  off_site_preference: '3'  # on-site or remote
  minor_segment: '109'  # CRE - art or creative director
  reason_created: '1'  # net new position
  how_heard: '1031'  # client initiated business
  position_title: Example Autotest Order Name +field_abbr +timestamp
  internal_order_info: Example Autotest Order Name +field_abbr +timestamp
  onboarding_notes: Example Autotest Order Name +field_abbr +timestamp
  complete_onboarding: false
  add_order_credit:
    - Automation, Test
    - 1773265
    - 100
  financial_info:
    rate_type: 1 # Hourly
    regular_pay_rate: 35  # remove or replace this field key if daily rate order
    exclusive: '1' #Yes
    direct: '1' #Yes
  # optional order fields - please only include those necessary for the test
  pay_type_contractor: true  # if you want independent contractor instead of w2
  talent_paid_via_umbrella_company: false
  use_dtr_timecards: false
  placement_type: '2' # perm
  order_importance: '3'  # green
  number_of_openings: 1
  account_manager: Automation, Test
  sales_manager: Automation, Test
  fulfillment_manager: Automation, Test
  assisted_by: Automation, Test
  # optional quick fill
  quick_fill:
    talent_id: # value can be filled in the test or added here
    work_location_type: # report_to or talent_home
  # optional UK specific fields
  UK_specific_fields: true

